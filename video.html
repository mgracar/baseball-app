<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baseball – Video</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <i class="ti ti-signal-4g"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-2"></i>
    </div>
  </div>
  <div class="screen">
    <div class="fixed-top"><div class="page-title">Video</div></div>
    <div class="divider-h" style="margin-top:10px"></div>
    <div class="scroll-view">
      <div class="inner-pad">
        <div class="empty-state">
          <div class="empty-icon"><i class="ti ti-player-play"></i></div>
          <div class="empty-title">Video highlights</div>
          <div class="empty-body">Game highlights and replays will appear here.</div>
        </div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><div class="nav-icon-wrap"><i class="ti ti-home"></i></div><span class="nav-label">Home</span></a>
    <a class="nav-item" href="teams.html"><div class="nav-icon-wrap"><i class="ti ti-shield"></i></div><span class="nav-label">Teams</span></a>
    <a class="nav-item" href="players.html"><div class="nav-icon-wrap"><i class="ti ti-user"></i></div><span class="nav-label">Players</span></a>
    <a class="nav-item" href="events.html"><div class="nav-icon-wrap"><i class="ti ti-calendar"></i></div><span class="nav-label">Events</span></a>
    <a class="nav-item active" href="video.html"><div class="nav-icon-wrap"><i class="ti ti-player-play"></i><div class="nav-dot"></div></div><span class="nav-label">Video</span></a>
  </nav>
</div>
</body>
</html>
